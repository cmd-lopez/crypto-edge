[project]
name = "crypto-edge"
version = "0.1.0"
description = "Edge research and (conditionally) a small spot trading system"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
